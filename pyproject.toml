[project]
name = "datalogger-to-ml"
version = "1.4.0"
description = "Command line tool for extracting and saving Fermi control system historical data."
authors = [{ name = "Beau Harrison", email = "beau@fnal.gov" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "tables>=3.9.2",
    "requests>=2.32",
    "isodate>=0.6",
    "pytz",
    "PyYAML>=6.0.1",
    "pacsys>=0.3.0,<0.4",
]

[project.scripts]
datalogger-to-ml = "datalogger_to_ml.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datalogger_to_ml"]

# ── pixi: development and deployment environment ────────────────────────────
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.dependencies]
python = "3.12.*"
pandas = ">=2.2"
pytables = ">=3.9.2"
requests = ">=2.32"
isodate = ">=0.6"
pytz = "*"
pyyaml = ">=6.0.1"
pytest = "*"
flake8 = "*"
python-build = "*"
# Kerberos headers: pacsys depends on gssapi, which PyPI ships for Linux only as source, built against these.
krb5 = "*"

[tool.pixi.pypi-dependencies]
datalogger-to-ml = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest"
lint = """flake8 . --exclude .pixi,.git,dist --count --select=E9,F63,F7,F82 --show-source --statistics \
&& flake8 . --exclude .pixi,.git,dist --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics"""
build = "python -m build"
deploy = { cmd = "scp dist/* chablis.fnal.gov:/usr/local/www/data/pip3/datalogger-to-ml/", depends-on = ["build"] }
clean = "rm -rf dist build __pycache__ datalogger_to_ml/__pycache__ datalogger_to_ml/dpm_data/__pycache__ nanny.log"
