# Lint and test in the pixi environment defined in pyproject.toml (pixi.lock pins every package).
name: Python application

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: prefix-dev/setup-pixi@v0.11.3
      with:
        pixi-version: v0.82.0
        cache: true
    - name: Lint with flake8
      run: pixi run lint
    - name: Test with pytest
      run: pixi run test
